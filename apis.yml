name: Unnatural Products
description: Unnatural Products (UNP) is a Santa Cruz, California biotechnology company
  founded in 2017 by UC Santa Cruz alumni Cameron Pye and Joshua Schwochert. The company
  operates a drug-discovery platform for synthetic macrocyclic peptides, combining data
  science, machine learning, and parallel chemical synthesis to rapidly optimize potency,
  selectivity, and passive membrane permeability against traditionally "undruggable" targets
  that sit between small molecules and biologics. UNP works primarily through pharmaceutical
  research collaborations, including partnerships with Novartis, Merck, Argenx, and BridgeBio,
  and has raised approximately $38.4M. Surfaced as a portfolio company of Wing Venture Capital,
  it exposes no public API or developer platform.
